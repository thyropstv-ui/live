<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogos | Thyrops Live</title>
<meta name="description" content="Todos os jogos do RetroAchievements com status, progresso e tempo de jogo.">
<meta name="theme-color" content="#050718">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="tema.js"></script>
<link rel="stylesheet" href="tema.css">
<link rel="stylesheet" href="site.css">
</head>
<body data-pagina="jogos.html">
<div class="pagina">
  <header id="topo"></header>
  <main>
    <p class="intro" id="intro">Todos os jogos com conquistas no RetroAchievements: platinados, zerados e em andamento, com o progresso e o tempo de cada um.</p>
    <div class="busca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="busca" class="entrada" type="search" placeholder="Buscar jogo" autocomplete="off" aria-label="Buscar jogo">
    </div>
    <div class="chips" id="st" role="group" aria-label="Status"></div>
    <div class="chips" id="cs" role="group" aria-label="Console"></div>
    <p class="contagem" id="cont"></p>
    <div class="grade-s" id="lista"></div>
    <div class="vazio" id="vazio" hidden><p></p></div>
  </main>
  <footer id="rodape"></footer>
</div>
<script src="site.js"></script>
<script>
let J=[],st="Todos",cs="Todos",q="";
const STS=[["Todos",()=>true],["Platinados",g=>g.platinado],["Zerados",g=>g.zerado&&!g.platinado],["Em andamento",g=>!g.zerado],["Feitos em live",g=>g.emLive],["Falta fazer em live",g=>g.platinado&&!g.emLive]];
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function chips(box,lista,atual,fn){
  box.innerHTML=lista.map(n=>'<button type="button" class="chip" data-v="'+esc(n)+'" aria-pressed="'+(n===atual)+'">'+esc(n)+'</button>').join("");
  qsa(".chip",box).forEach(b=>b.onclick=()=>{fn(b.dataset.v);qsa(".chip",box).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));desenha()});
}
function desenha(){
  const f=STS.find(x=>x[0]===st)[1],t=norm(q.trim());
  const l=J.filter(g=>f(g)&&(cs==="Todos"||g.console===cs)&&(!t||norm(g.titulo+" "+g.console).includes(t)));
  qs("#cont").textContent=l.length+(l.length===1?" jogo":" jogos");
  qs("#vazio").hidden=l.length>0;qs("#vazio p").textContent="Nenhum jogo com esses filtros.";
  qs("#lista").innerHTML=l.map(g=>{
    const tempo=fmtTempo(g.tempoSeg),p=g.conquistas?Math.round(g.ganhas/g.conquistas*100):g.pct||0;
    const sel=(g.platinado?'<span class="sel pl">Platina</span>':g.zerado?'<span class="sel zr">Zerado</span>':'<span class="sel">Em andamento</span>')+(g.emLive?'<span class="sel live">Em live</span>':"");
    return '<div class="jogo"><div class="hud"><div class="hud-in"><div class="capa-j">'+(g.imagem?'<img loading="lazy" alt="" src="'+esc(g.imagem)+'" onerror="this.remove()">':"")+'</div><div class="corpo"><h3 title="'+esc(g.titulo)+'">'+esc(g.titulo)+'</h3>'+
      '<div class="sub">'+esc(g.console)+' · <a href="https://retroachievements.org/game/'+encodeURIComponent(g.id)+'" target="_blank" rel="noopener">RetroAchievements ↗</a></div><div style="margin-top:6px">'+sel+'</div>'+
      '<div class="linha-j"><span>'+(g.conquistas?g.ganhas+" / "+g.conquistas+" conquistas":"")+'</span><span>'+esc(tempo)+'</span></div>'+
      (g.conquistas?'<div class="barra-p"><i style="width:'+p+'%"></i></div>':"")+'</div></div></div></div>';}).join("");
}
(async function(){
  let D;try{D=await carregaDados()}catch(e){return erroCarga(qs("main"),"Não foi possível carregar o dados.json.")}
  J=(D.placar&&D.placar.jogos)||[];
  if(!J.length){qs("#intro").textContent="A lista de jogos aparece aqui quando a atualização automática estiver ligada (veja o README, seção \"Como o site se atualiza sozinho\").";qs("#st").hidden=true;qs("#cs").hidden=true;qs(".busca").hidden=true;return}
  qs("#intro").insertAdjacentHTML("beforeend"," Atualizado em "+esc(String(D.placar.atualizado).slice(0,10).split("-").reverse().join("/"))+".");
  chips(qs("#st"),STS.map(x=>x[0]),st,v=>st=v);
  const cons=["Todos",...new Set(J.map(g=>g.console).filter(Boolean))];
  if(cons.length>2)chips(qs("#cs"),cons,cs,v=>cs=v);else qs("#cs").hidden=true;
  qs("#busca").addEventListener("input",e=>{q=e.target.value;desenha()});
  desenha();
})();
</script>
</body>
</html>
