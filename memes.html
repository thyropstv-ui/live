<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memes | Thyrops Live</title>
<meta name="description" content="Teste os memes do chat e copie o comando.">
<meta name="theme-color" content="#050718">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="tema.js"></script>
<link rel="stylesheet" href="tema.css">
<link rel="stylesheet" href="site.css">
</head>
<body data-pagina="memes.html">
<div class="pagina">
  <header id="topo"></header>
  <main>
    <p class="intro">Toque no play para ouvir o meme. Clique no comando para copiar e colar no chat.</p>
    <div class="busca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="busca" class="entrada" type="search" placeholder="Buscar meme" autocomplete="off" aria-label="Buscar meme">
    </div>
    <div class="grade-s" id="lista"></div>
    <dialog class="vdlg" id="vdlg"><div class="hud"><div class="hud-in"><div class="topo-d"><b id="vt"></b><button type="button" class="botao botao--sec" id="vx">Fechar</button></div><video id="vv" controls playsinline></video><iframe id="vif" allow="autoplay; fullscreen" allowfullscreen hidden></iframe></div></div></dialog>
    <div class="vazio" id="vazio" hidden><p>Nenhum meme encontrado.</p></div>
  </main>
  <footer id="rodape"></footer>
</div>
<script src="site.js"></script>
<script>
const OLHO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
/* mp4/webm/mov (ou link do Drive) = só o olho; mp3/wav/ogg... = só o play. Para forçar: "tipo": "video" ou "audio" */
function ehVideo(a,m){m=m||{};if(m.tipo==="audio")return false;if(m.tipo==="video"||m.video===true)return true;a=String(a||"");if(/\.(mp3|wav|ogg|m4a|aac)$/i.test(a))return false;return /\.(mp4|webm|mov)$/i.test(a)||!!idDrive(a)}
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
let audio=null,atual=null,memes=[];
/* "arquivo" pode ser só o nome (bonk.mp4), um caminho (assets/memes/bonk.mp4) ou uma URL completa */
function idDrive(a){a=String(a||"").trim();let m=a.match(/^drive:([\w-]{10,})$/i)||a.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||a.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([\w-]+)/);return m?m[1]:""}
function urlMeme(a){a=String(a||"").trim();const g=idDrive(a);if(g)return "https://drive.google.com/uc?export=download&id="+g;if(/^https?:\/\//i.test(a))return a;if(a.indexOf("/")<0)a="assets/memes/"+a;return a.split("/").map(encodeURIComponent).join("/")}
function solta(){if(!atual)return;atual.btn.innerHTML=PLAY;atual.el.classList.remove("tocando")}
function tocar(m,el,btn,ds){
  if(atual&&atual.m===m&&audio){audio.paused?audio.play():audio.pause();return}
  if(audio){audio.pause();audio.src="";solta();audio=null;atual=null}
  const a=new Audio(urlMeme(m.arquivo));audio=a;atual={m,el,btn};
  a.onplaying=()=>{btn.innerHTML=PAUSE;el.classList.add("tocando")};
  a.onpause=()=>{btn.innerHTML=PLAY;el.classList.remove("tocando")};
  a.onended=()=>{solta();audio=null;atual=null};
  a.onerror=()=>{solta();audio=null;atual=null;ds.textContent="não consegui tocar este arquivo";ds.classList.add("ruim")};
  a.play().catch(()=>{});
}
function abreVideo(m){
  if(audio){audio.pause();audio.src="";solta();audio=null;atual=null}
  const d=qs("#vdlg"),v=qs("#vv");
  const g=idDrive(m.arquivo),f=qs("#vif");
  qs("#vt").textContent=m.comando;
  if(g){v.hidden=true;f.hidden=false;f.src="https://drive.google.com/file/d/"+g+"/preview";d.showModal()}  /* o player do próprio Drive é o que funciona com link público */
  else{f.hidden=true;v.hidden=false;v.src=urlMeme(m.arquivo);d.showModal();v.play().catch(()=>{})}
}
function fechaVideo(){const d=qs("#vdlg"),v=qs("#vv");qs("#vif").removeAttribute("src");v.pause();v.removeAttribute("src");v.load();if(d.open)d.close()}
function monta(){
  const raiz=qs("#lista");
  memes.forEach(m=>{
    const el=document.createElement("div");el.className="meme";
    el._hay=(m.comando+" "+(m.descricao||"")).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
    el.innerHTML='<div class="hud"><div class="hud-in"><div class="info"><button type="button" class="cmd"></button><div class="ds"></div></div><button type="button" class="btn-play" aria-label="Ouvir meme">'+PLAY+'</button>'+'<button type="button" class="btn-ver" aria-label="Ver vídeo" title="Ver vídeo">'+OLHO+'</button>'+'</div></div>';
    const cmd=qs(".cmd",el),ds=qs(".ds",el),btn=qs(".btn-play",el);
    cmd.textContent=m.comando;cmd.title="Copiar "+m.comando;ds.textContent=m.descricao||"";
    cmd.onclick=async()=>toast((await copiar(m.comando+" "))?"Copiado "+m.comando:"Não foi possível copiar");
    const ver=qs(".btn-ver",el),video=ehVideo(m.arquivo,m);
    if(video){btn.remove();ver.onclick=()=>abreVideo(m);if(!m.arquivo){ver.disabled=true;ver.title="Vídeo não configurado"}}
    else{ver.remove();if(!m.arquivo){btn.disabled=true;btn.title="Áudio não configurado"}else btn.onclick=()=>tocar(m,el,btn,ds)}
    raiz.appendChild(el);
  });
}
qs("#vx").onclick=fechaVideo;
qs("#vdlg").addEventListener("click",e=>{if(e.target===qs("#vdlg"))fechaVideo()});
qs("#vdlg").addEventListener("close",()=>{const v=qs("#vv");qs("#vif").removeAttribute("src");v.pause();v.removeAttribute("src")});
(async function(){
  try{memes=await carregaJson("memes.json")}catch(e){return erroCarga(qs("main"),"Não foi possível carregar o memes.json.")}
  monta();
  qs("#busca").addEventListener("input",e=>{
    const q=e.target.value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();let n=0;
    qsa(".meme").forEach(c=>{const ok=!q||c._hay.includes(q);c.hidden=!ok;if(ok)n++});
    qs("#vazio").hidden=n>0;
  });
})();
</script>
</body>
</html>
