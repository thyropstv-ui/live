name: Atualizar dados do site

on:
  schedule:
    - cron: "7 * * * *"      # a cada hora
  workflow_dispatch:          # botão "Run workflow" na aba Actions
  push:
    paths:
      - "assets/memes/**"
      - "em-live.json"
      - "nao-em-live.json"

permissions:
  contents: write

jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar auto.json e memes.json
        env:
          RA_API_KEY: ${{ secrets.RA_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: node scripts/atualiza.mjs
      - name: Salvar se mudou
        run: |
          git config user.name "atualizacao-automatica"
          git config user.email "actions@users.noreply.github.com"
          git add auto.json memes.json
          git diff --cached --quiet || (git commit -m "Atualiza dados do site" && git push)
