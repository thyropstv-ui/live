<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Overlay Voz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap');

  :root {
    --roxo: #a855f7;
    --azul: #4f7cff;
    --fundo: #120a33;
  }

  html, body {
    margin: 0;
    background: transparent;
    overflow: hidden;
    font-family: 'Barlow Condensed', sans-serif;
  }

  #card {
    width: 360px;
    height: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    opacity: 0;
    transform: scale(.7);
    transition: opacity .35s ease, transform .35s cubic-bezier(.2,1.4,.4,1);
  }
  #card.on { opacity: 1; transform: scale(1); }

  .anel {
    position: relative;
    width: 240px;
    height: 240px;
    filter: drop-shadow(0 0 14px rgba(168,85,247,.75));
  }
  .anel svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .anel .trilho { fill: none; stroke: rgba(120,100,255,.25); stroke-width: 10; }
  .anel .prog {
    fill: none;
    stroke: url(#grad);
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 628.3;
    stroke-dashoffset: 0;
  }
  .anel.urgente .prog { stroke: #ff4d6d; }
  .anel.urgente { animation: pulsa .8s infinite alternate; }
  @keyframes pulsa { to { filter: drop-shadow(0 0 22px rgba(255,77,109,.9)); } }

  .miolo {
    position: absolute;
    inset: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, #2a1a66, var(--fundo));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 110px;
    line-height: 1;
    overflow: hidden;
  }
  .miolo img { width: 82%; height: 82%; object-fit: contain; }

  #nome {
    color: #fff;
    font-weight: 700;
    font-size: 40px;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-shadow: 0 0 12px var(--roxo), 0 0 26px var(--azul);
    text-align: center;
    max-width: 340px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #quem {
    color: #b9a8ff;
    font-weight: 600;
    font-size: 20px;
    margin-top: -8px;
    min-height: 22px;
  }
  #timer {
    color: #fff;
    font-weight: 700;
    font-size: 46px;
    letter-spacing: 3px;
    padding: 0 22px;
    border: 2px solid var(--roxo);
    border-radius: 8px;
    background: rgba(18,10,51,.8);
    box-shadow: 0 0 14px rgba(168,85,247,.6) inset, 0 0 14px rgba(79,124,255,.5);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div id="card">
  <div class="anel" id="anel">
    <svg viewBox="0 0 240 240">
      <defs>
        <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#a855f7"/>
          <stop offset="100%" stop-color="#4f7cff"/>
        </linearGradient>
      </defs>
      <circle class="trilho" cx="120" cy="120" r="100"/>
      <circle class="prog" id="prog" cx="120" cy="120" r="100"/>
    </svg>
    <div class="miolo" id="miolo"></div>
  </div>
  <div id="nome"></div>
  <div id="quem"></div>
  <div id="timer">02:00</div>
</div>

<script>
  // ====== CONFIG ======
  const params   = new URLSearchParams(location.search);
  const WS_URL   = params.get('ws') || 'ws://127.0.0.1:8080/'; // WebSocket Server do Streamer.bot
  // Emoji para vozes que no JSON têm "carinha" em vez de "emoji"
  const EMOJI_CARINHA = { banana: '🍌', mel: '👧' };
  // ====================

  const card  = document.getElementById('card');
  const anel  = document.getElementById('anel');
  const prog  = document.getElementById('prog');
  const miolo = document.getElementById('miolo');
  const nome  = document.getElementById('nome');
  const quem  = document.getElementById('quem');
  const timer = document.getElementById('timer');

  const CIRC = 2 * Math.PI * 100;
  let fim = 0, total = 120000, raf = null, hideTO = null;

  function fmt(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  function tick() {
    const resta = fim - Date.now();
    if (resta <= 0) { esconder(); return; }
    timer.textContent = fmt(resta);
    prog.style.strokeDashoffset = CIRC * (1 - resta / total);
    anel.classList.toggle('urgente', resta <= 10000);
    raf = requestAnimationFrame(tick);
  }

  function mostrar(d) {
    clearTimeout(hideTO);
    cancelAnimationFrame(raf);

    // Usa o emoji do troca-voz.json; se a voz só tem "carinha", usa o emoji do mapa abaixo
    miolo.textContent = d.emoji || EMOJI_CARINHA[d.carinha] || '🎙️';

    nome.textContent = d.nome || '';
    quem.textContent = d.usuario ? 'por @' + d.usuario : '';

    total = (d.duracao || 120) * 1000;
    fim = Date.now() + total;
    prog.style.strokeDashoffset = 0;
    anel.classList.remove('urgente');

    card.classList.add('on');
    tick();
  }

  function esconder() {
    cancelAnimationFrame(raf);
    card.classList.remove('on');
  }

  function conectar() {
    const ws = new WebSocket(WS_URL);
    ws.onopen = () => {
      // Inscreve no evento que o CPH.WebsocketBroadcastJson dispara
      ws.send(JSON.stringify({
        request: 'Subscribe',
        id: 'voz-overlay',
        events: { General: ['Custom'] }
      }));
    };
    ws.onmessage = (ev) => {
      let d;
      try { d = JSON.parse(ev.data); } catch (e) { return; }
      // Custom chega como { event:{source,type}, data:{...nosso json...} }
      let p = (d && d.event && d.data !== undefined) ? d.data : d;
      if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { return; } }
      if (!p) return;
      if (p.evento === 'voz_inicio') mostrar(p);
      else if (p.evento === 'voz_fim') esconder();
    };
    ws.onclose = () => setTimeout(conectar, 2000);
    ws.onerror = () => ws.close();
  }
  conectar();

  // Teste no navegador: abra o arquivo com #teste na URL
  if (location.hash === '#teste') {
    mostrar({ nome: 'The Spellcaster', emoji: '🧙', usuario: 'thyrops', duracao: 20 });
  }
</script>
</body>
</html>
